<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>frame-it — recent wallpapers</title>
<style>
  :root {
    --bg: #1c1c1e;
    --panel: #2a2a2d;
    --line: #3a3a3e;
    --text: #e8e8ea;
    --muted: #9a9aa2;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline;
    padding: 14px 20px;
    background: rgba(28,28,30,.94);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(8px);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  header a { color: var(--accent); text-decoration: none; font-size: 12px; }
  header a:hover { text-decoration: underline; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 18px;
    padding: 20px;
  }
  .tile {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    transition: border-color .15s ease, transform .15s ease;
  }
  .tile:hover { border-color: #55555c; transform: translateY(-2px); }

  .frame { position: relative; display: block; aspect-ratio: 16 / 9; background: #000; cursor: zoom-in; }
  .frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Scrim so the overlay text stays readable on bright images, standing in for
     the luminance-aware colour the real stamp uses. */
  .frame::after, #lightbox .stage::after {
    content: ""; position: absolute; inset: auto 0 0 0; height: 40%;
    background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0));
    pointer-events: none; z-index: 1;
  }
  .frame .fallback {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: var(--muted); font-size: 12px;
  }

  /* Overlay text, positioned like the stamps drawn on the uploaded image. */
  .stamp {
    position: absolute; bottom: 6px;
    font-size: clamp(9px, 1.1vw, 12px);
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.6);
    pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    z-index: 2;
  }
  .stamp.left { left: 8px; max-width: 55%; }
  .stamp.right { right: 8px; max-width: 80%; text-align: right; }

  .info { padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  .info .when { font-weight: 600; font-size: 13px; }
  .info .desc { color: var(--text); margin-top: 3px; }
  .info dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 8px 0 0; }
  .info dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .info dd { margin: 0; font-size: 12px; overflow-wrap: anywhere; }
  .info a { color: var(--accent); text-decoration: none; }
  .info a:hover { text-decoration: underline; }
  .badge {
    display: inline-block; margin-left: 6px; padding: 1px 6px;
    border: 1px solid var(--line); border-radius: 10px;
    color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
  }

  .empty { padding: 60px 20px; text-align: center; color: var(--muted); }

  #lightbox {
    position: fixed; inset: 0; z-index: 10; display: none;
    background: rgba(0,0,0,.94); cursor: zoom-out;
  }
  #lightbox.open { display: grid; place-items: center; }
  #lightbox .stage { position: relative; max-width: 96vw; max-height: 92vh; }
  #lightbox img { max-width: 96vw; max-height: 92vh; display: block; }
  #lightbox .stamp { font-size: clamp(12px, 1.4vw, 22px); bottom: 14px; }
  #lightbox .stamp.left { left: 20px; }
  #lightbox .stamp.right { right: 20px; }
</style>
</head>
<body>
<header>
  <h1>frame-it</h1>
  <span class="meta">{{len .Entries}} most recent · {{.Dir}}</span>
  <span class="spacer"></span>
  <span class="meta">{{.Generated}}</span>
  <a href="/">Refresh</a>
</header>

{{if not .Entries}}
  <p class="empty">No archived images in <code>{{.Dir}}</code> yet — run <code>frame-it wallpaper</code> first.</p>
{{else}}
<div class="grid">
  {{range .Entries}}
  <figure class="tile">
    <a class="frame" href="/full/{{.Name}}" data-full="/full/{{.Name}}"
       data-caption="{{.Caption}}" data-date="{{.DateStamp}}">
      <img src="/thumb/{{.Name}}" alt="{{.Name}}" loading="lazy">
      {{if .Caption}}<span class="stamp left">{{.Caption}}</span>{{end}}
      {{if .DateStamp}}<span class="stamp right">{{.DateStamp}}</span>{{end}}
    </a>
    <figcaption class="info">
      <div class="when">{{.Clock}}{{if not .HasMeta}}<span class="badge">no metadata</span>{{end}}</div>
      {{if .Description}}<div class="desc">{{.Description}}</div>{{end}}
      <dl>
        {{if .Source}}<dt>Source</dt><dd>{{.Source}}{{if .ID}} · {{.ID}}{{end}}</dd>{{end}}
        {{if .Credit}}<dt>Credit</dt><dd>{{.Credit}}</dd>{{end}}
        {{if .Query}}<dt>Query</dt><dd>{{.Query}}</dd>{{end}}
        {{if .Resolution}}<dt>Original</dt><dd>{{.Resolution}}{{if .Size}} · {{.Size}}{{end}}</dd>{{else if .Size}}<dt>Size</dt><dd>{{.Size}}</dd>{{end}}
        <dt>File</dt><dd>{{.Name}}</dd>
        {{if .PageURL}}<dt>Page</dt><dd><a href="{{.PageURL}}" target="_blank" rel="noreferrer noopener">{{.PageURL}}</a></dd>{{end}}
      </dl>
    </figcaption>
  </figure>
  {{end}}
</div>
{{end}}

<div id="lightbox">
  <div class="stage">
    <img alt="">
    <span class="stamp left"></span>
    <span class="stamp right"></span>
  </div>
</div>

<script>
  const box = document.getElementById('lightbox');
  const boxImg = box.querySelector('img');
  const boxLeft = box.querySelector('.stamp.left');
  const boxRight = box.querySelector('.stamp.right');

  document.querySelectorAll('.frame').forEach(function (el) {
    el.addEventListener('click', function (ev) {
      ev.preventDefault();
      boxImg.src = el.dataset.full;
      boxLeft.textContent = el.dataset.caption || '';
      boxRight.textContent = el.dataset.date || '';
      box.classList.add('open');
    });
  });

  function close() {
    box.classList.remove('open');
    boxImg.removeAttribute('src');
  }
  box.addEventListener('click', close);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { close(); }
  });
</script>
</body>
</html>
